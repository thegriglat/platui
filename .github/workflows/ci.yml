name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Go module
        id: gomod
        run: test -f go.mod && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.gomod.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - name: Build
        if: steps.gomod.outputs.present == 'true'
        run: go build ./...
      - name: Vet
        if: steps.gomod.outputs.present == 'true'
        run: go vet ./...
      - name: Test
        if: steps.gomod.outputs.present == 'true'
        run: go test -race ./...
