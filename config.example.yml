# platui — full example config. Path: ~/.config/platui/config.yml
# (or $XDG_CONFIG_HOME/platui/config.yml, or --config <path>).
# Unknown keys are an error. Defaults are shown unless stated otherwise.

# --- Plane connection ---
base_url: https://api.plane.so   # for self-hosted, your instance URL; a trailing "/" is trimmed
api_key: plane_api_xxx           # Plane API key (Profile settings → Personal Access Tokens); keep this file private (chmod 600)
# api_key_env: PLANE_API_KEY     # OR the name of an environment variable holding the key; set only one of the two
workspace: my-team               # workspace slug from the Plane URL (required; a single workspace)
default_project: PROJ            # identifier of the project opened at start (optional)
web_url: ""                      # base URL of the web UI; empty: derived from base_url

# --- Git branches ---
branch:
  template: "{identifier}-{sequence}-{slug}"      # placeholders: {identifier} {sequence} {slug}
  base: ""                                        # branch to create from; empty: current HEAD
  checkout: true                                  # switch to the created branch
  worktree: false                                 # true: create the branch in a separate git worktree
  worktree_dir: "../{repo}-{branch}"              # placeholders: {repo} {branch}; a relative path is from the repository root
  commit_template: "{identifier}-{sequence}: {title}"  # placeholders: {identifier} {sequence} {title} {slug}
  remote: origin

# --- "Start work" and "ready for review" scenarios ---
workflow:
  start_state: ""                # state name to start in; empty: first state of the started group
  review_state: ""               # empty: the "In Review" state (case-insensitive); if absent, leave the state unchanged

# --- GitLab merge request (via glab) ---
gitlab:
  host: ""                       # name[:port] without scheme; empty: host from the remote URL
  repo: ""                       # group/project; empty: from the remote URL
  target_branch: ""              # MR target; empty: the project's default branch
  draft: false                   # create the MR as a draft
  glab: glab                     # name or path of the glab binary
  mr_cache: 10m                  # how long to remember MRs found for a task ("Go to MR"); 0: no caching

# --- Tabs by state ---
tabs:
  states: []                     # state names in tab order; empty: all project states,
                                 # except groups in hide_groups (by group, then by sequence)
  hide_groups: [cancelled]       # from backlog|unstarted|started|completed|cancelled; applies when states is empty; []: hide nothing
  all: true                      # first tab "All"

# --- Saved filters (at most 9; the F menu and the command palette) ---
# Non-empty criteria are combined with AND, values within a list with OR.
filters:
  - name: My in progress           # required
    project: ""                  # identifier; empty: current project
    mine: true                   # assignee is me
    state_groups: [started]      # from backlog|unstarted|started|completed|cancelled
    states: []                   # state names (case-insensitive)
    priorities: [urgent, high]   # from urgent|high|medium|low|none
    labels: []                   # label names (case-insensitive)
    text: ""                     # substring of the title (case-insensitive)

# --- Appearance ---
theme:
  no_color: false                # true (or a non-empty NO_COLOR): no colors
  colors:                        # optional; "#RRGGBB" or "0".."255" (ANSI 256)
    accent: "#7D56F4"            # keys: accent muted text error success warning selection border
                                 #        priority_urgent priority_high priority_medium priority_low

# --- Misc ---
editor: ""                       # empty → $VISUAL → $EDITOR → vi

refresh:
  interval: 2m                   # background refresh; 0: off, otherwise at least 30s (API limit is 60 requests/min)
  notify: true                   # highlight and bell on new/changed tasks

cache:
  enabled: true                  # on-disk cache for a fast start
  dir: ""                        # empty → $XDG_CACHE_HOME/platui, else ~/.cache/platui

# --- Interface ---
ui:
  mouse: true                    # mouse support
  preview_width: 45              # preview width, %: 20..80

# --- Personal todo ---
todo:
  path: ""                       # empty → $XDG_DATA_HOME/platui/todo.md, else ~/.local/share/platui/todo.md

# --- Custom commands (key; placeholders are substituted already quoted: do not add quotes yourself) ---
# Placeholders: {id} {key} {branch} {url} {title} {mr_url}
commands:
  - name: Open branch in editor
    key: ""                      # optional; must not clash with a built-in key
    command: code -- {branch}
    confirm: false               # ask for confirmation
    output: status               # status | window | none

# --- HTTP to Plane ---
# http:
#   timeout: 30s
#   retries: 3
#   ca_file: ~/certs/my-ca.crt   # PEM with trusted CAs (one or more), added to the system ones; for self-hosted with its own CA
